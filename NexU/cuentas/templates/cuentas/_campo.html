{# Campo de formulario reutilizable. Si es contraseña, agrega el botón mostrar/ocultar #}
<div class="campo{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% if campo.field.widget.input_type == 'password' %}
    <div class="campo-password">
      {{ campo }}
      <button type="button" class="ver-password" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg class="ojo-abierto" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="ojo-cerrado oculto" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18.4 18.4 0 0 1 4.1-4.9M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M3 3l18 18"/></svg>
      </button>
    </div>
  {% else %}
    {{ campo }}
  {% endif %}
  {% for error in campo.errors %}<p class="campo-error">{{ error }}</p>{% endfor %}
</div>
